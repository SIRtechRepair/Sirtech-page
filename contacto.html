<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto | SIR·TECH</title>
  <meta name="description" content="Dirección, horario y contacto de SIR·TECH en Arauca.">
  <link rel="icon" type="image/x-icon" href="favicon_io/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png">
  <link rel="manifest" href="favicon_io/site.webmanifest">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,700;1,700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="contacto">
  <div id="header"></div>

  <main>
    <section class="page-head container">
      <span class="chip">Te respondemos rápido</span>
      <h1>Contacto</h1>
      <p>Visítanos en el taller o escríbenos y te ayudamos.</p>
    </section>

    <section class="container" style="padding-bottom:3rem">
      <div class="ubi js-ubicacion"></div>
    </section>

    <section class="sec">
      <div class="container">
        <h2 class="sec-title">Escríbenos</h2>
        <p class="sec-sub">Llena el formulario y te llega directo a WhatsApp</p>
        <form class="form" id="form-contacto" novalidate>
          <div class="form-grid">
            <div><input class="fld" id="f-nombre" placeholder="Tu nombre"><div class="err" id="e-f-nombre"></div></div>
            <div><select class="fld" id="f-equipo"></select><div class="err" id="e-f-equipo"></div></div>
          </div>
          <textarea class="fld" id="f-mensaje" rows="5" placeholder="Mi celular no carga desde ayer"></textarea>
          <div class="err" id="e-f-mensaje"></div>
          <button type="submit" class="btn" style="margin-top:12px"><i class="ti ti-brand-whatsapp"></i> Enviar por WhatsApp</button>
        </form>
      </div>
    </section>
  </main>

  <div id="footer"></div>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
